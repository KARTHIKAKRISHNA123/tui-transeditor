# config/workflows.yaml — change the PIPELINE without changing code (Open/Closed).
pipeline:
  process: sequential
  stages: [translator, reviewer, corrector, qa]
quality:
  enable_back_translation: false   # round-trip check in quality_service (costs 1 extra call)
  pass_threshold: 0.80             # min average adequacy+fluency to "pass"
runtime:
  verbose: false                   # set true to see CrewAI's full reasoning in the console
  max_rpm: 25                      # under Groq free tier's 30 req/min cap